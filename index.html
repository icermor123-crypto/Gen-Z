:root{
  color-scheme:light dark;
  --bg:#F1F8F8; --surface:#FFFFFF; --soft:#E0EFF0; --ink:#0E3138; --muted:#4D6E74; --line:#CBE0E2;
  --accent:#008094; --on-accent:#FFFFFF; --brass:#C8470E; --warn:#C93C12; --ok:#00806F; --word:#E74919;
  --pend-bg:#F7EFDC; --pend-ink:#7A5A10; --done-bg:#D9F2EE; --done-ink:#00695F;
  --s-prod:#008094; --s-china:#CAA14F; --s-usa:#00A394; --s-transito:#ED752A; --s-aduana:#E74919; --s-otro:#7B9396;
  --grad:linear-gradient(90deg,#008094,#00A394,#CAA14F,#ED752A,#E74919);
  --sys:"Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#08252B; --surface:#0E343B; --soft:#15434B; --ink:#EAF6F5; --muted:#9CC4C8; --line:#235760;
    --accent:#1FC7B5; --on-accent:#04222A; --brass:#F28A4B; --warn:#FF8A6A; --ok:#4FE0CC; --word:#F28A4B;
    --pend-bg:#3B3521; --pend-ink:#E6C877; --done-bg:#0F4D49; --done-ink:#6FE0D2;
    --s-prod:#2BB3C9; --s-china:#D9B565; --s-usa:#1FC7B5; --s-transito:#F28A4B; --s-aduana:#F2694A; --s-otro:#8FB0B3;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
    --bg:#08252B; --surface:#0E343B; --soft:#15434B; --ink:#EAF6F5; --muted:#9CC4C8; --line:#235760;
    --accent:#1FC7B5; --on-accent:#04222A; --brass:#F28A4B; --warn:#FF8A6A; --ok:#4FE0CC; --word:#F28A4B;
    --pend-bg:#3B3521; --pend-ink:#E6C877; --done-bg:#0F4D49; --done-ink:#6FE0D2;
    --s-prod:#2BB3C9; --s-china:#D9B565; --s-usa:#1FC7B5; --s-transito:#F28A4B; --s-aduana:#F2694A; --s-otro:#8FB0B3;
}
:root[data-theme="light"]{color-scheme:light}
.hbtns{display:flex;gap:8px}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 Themix,"Avenir Next","Segoe UI",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:14px;color:var(--muted);margin-bottom:10px}
label input,label select{margin-top:4px;color:var(--ink)}
small{color:var(--muted)}
h2{font-size:19px;margin:0}
h3{font-size:16px;margin:22px 0 8px}
.num{font-variant-numeric:tabular-nums}

#shell{max-width:640px;margin:0 auto;padding:0 14px 96px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 10px}
.brand{font-family:Themix,"Avenir Next",system-ui,sans-serif;font-size:30px;line-height:1;font-weight:400;color:var(--word);margin:0}
.logo{display:flex;align-items:center;gap:12px}
.logo img{width:54px;height:auto;display:block}
.tag{font-size:13.5px;color:var(--muted);margin-top:3px}
.brandbar{height:5px;background:var(--grad)}
.num,.kpi b,.price,.stock b,.total b,.pnums,.crow .r,.legend b,.sale,.line .pr,.icost,.stepper,input,select,textarea{font-family:var(--sys)}
.icon-btn{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;display:grid;place-items:center}
.icon-btn svg,nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:5}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{background:none;border:0;padding:9px 4px 10px;display:grid;justify-items:center;gap:2px;font-size:12.5px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:700}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 16px;min-height:46px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-size:17px}
.btn.ghost{background:transparent;border-style:dashed;width:100%;color:var(--accent)}
.btn.danger{color:var(--warn);border-color:var(--warn);background:transparent}
.btn.block{width:100%}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:8px 0}
.notice{background:var(--soft);border:1px solid var(--brass);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:10px}
.syncb{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:2px 2px 10px;font-size:13.5px;color:var(--muted);text-align:left}
.dot{width:9px;height:9px;border-radius:50%;background:var(--s-usa);flex:none}
.dot.pend{background:var(--s-china)}
.dot.err{background:var(--s-aduana)}
.dot.sync{background:var(--s-prod);animation:pulse 1s infinite alternate}
@keyframes pulse{from{opacity:.35}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.dot.sync{animation:none}}
.hint{font-size:13.5px;color:var(--muted);margin:4px 0 10px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.status{display:inline-block;border-radius:999px;font-size:12.5px;padding:2px 10px;font-weight:600}
.status.pend{background:var(--pend-bg);color:var(--pend-ink)}
.status.done{background:var(--done-bg);color:var(--done-ink)}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--s-prod);border-radius:14px;padding:10px 14px 12px}
.kpi:nth-child(2){border-top-color:var(--s-usa)}
.kpi:nth-child(3){border-top-color:var(--s-china)}
.kpi:nth-child(4){border-top-color:var(--s-transito)}
.kpi small{display:block}
.kpi b{font-size:21px;font-variant-numeric:tabular-nums}
.kpi.good b{color:var(--ok)} .kpi.bad b{color:var(--warn)}

.pcard{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px}
.thumb{width:64px;height:64px;border-radius:12px;background:var(--soft);overflow:hidden;display:grid;place-items:center;border:0;padding:0;color:var(--muted);font-weight:700;font-size:22px}
.thumb span{display:grid;place-items:center;width:100%;height:100%;background:linear-gradient(135deg,#008094,#00A394);color:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.sm{width:52px;height:52px;font-size:18px}
.thumb.lg{width:88px;height:88px}
.pname{font-weight:700;line-height:1.25}
.psub{font-size:13px;color:var(--muted)}
.pnums{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:14px;margin-top:4px;font-variant-numeric:tabular-nums}
.price{color:var(--brass);font-weight:700}
.stock{text-align:center;min-width:54px;border-radius:12px;background:var(--soft);padding:6px 8px}
.stock b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stock small{font-size:11.5px}
.stock.low{background:transparent;border:1.5px solid var(--s-china)}
.stock.out{background:transparent;border:1.5px solid var(--s-aduana)} .stock.out b{color:var(--warn)}

.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.card.empty{padding-top:0;overflow:hidden}

.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
.empty .btn{margin:6px 4px 0}

.ocard{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.ocard .l1{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.ocard .l2{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--muted);margin-top:4px}

.icard,.erow{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.irow1{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:center;margin-bottom:6px}
.ibadge{font-size:13px;color:var(--muted);margin:0 0 8px}
.icost{font-size:14px;margin-top:2px;display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.rm{background:none;border:0;color:var(--warn);font-size:14px;padding:6px 0 0;font-weight:600}
.erow .row2{margin-top:8px}

.ladder{display:flex;height:22px;border-radius:7px;overflow:hidden;gap:2px;margin:2px 0 12px}
.ladder span{display:block;min-width:4px}
.legend{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:5px}
.legend li{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center;font-size:15px}
.legend i{width:12px;height:12px;border-radius:3px;display:block}
.legend b{font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--line);padding-top:10px;font-size:15px}
.total b{font-size:24px;font-variant-numeric:tabular-nums}
.crow{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line);font-size:15px}
.crow .r{text-align:right;font-variant-numeric:tabular-nums}
.crow .r div{white-space:nowrap}
.crow small{display:block}
.warn{color:var(--warn);font-size:14px;margin:8px 0 0}

.line{display:grid;grid-template-columns:1fr auto;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.line .nm{font-weight:700}
.stepper{display:grid;grid-template-columns:40px 56px 40px;gap:6px;align-items:center}
.stepper button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--soft);font-size:20px;font-weight:700}
.stepper input{text-align:center;padding:8px 4px}
.line .pr{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);grid-column:1/-1;flex-wrap:wrap}
.line .pr input{width:96px}
.pick{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.day{display:flex;justify-content:space-between;align-items:baseline;margin:20px 0 6px;font-weight:700}
.sale{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.sale button{background:none;border:0;color:var(--warn);padding:8px;font-size:14px}

.bars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:12px;color:var(--muted)}
.bars span{display:block;width:100%;background:linear-gradient(to top,#008094,#ED752A);border-radius:6px 6px 0 0;min-height:2px}

.sheet{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;overscroll-behavior:contain}
.sh-head{position:sticky;top:0;background:var(--bg);z-index:2;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.sh-wrap{max-width:640px;margin:0 auto}
.sh-body{max-width:640px;margin:0 auto;padding:6px 14px 120px}
.sh-foot{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 14px;z-index:3}
.sh-foot .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.sh-foot .btn{flex:1}
.photo-row{display:flex;gap:14px;align-items:center;margin:12px 0}
.photo-row small{display:block}

#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:15px;max-width:88vw;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

async function getAll(table,select,order){
  const t=await accessToken();let out=[],from=0;

async function upsert(table,rows,conflict){
  const t=await accessToken();
  const r=await fetch(SB_URL+'/rest/v1/'+table+'?on_conflict='+conflict,{method:'POST',headers:{apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows)});

async function pushAll(){
  const uid=session.user.id,now=new Date().toISOString();

    if(st.length){S.settings=Object.assign({},S.settings,st[0].data);syncState.base.settings=canon(settingsForSync());}
  }
  for(const c of COLS){
    const col=c[0],table=c[1],base=syncState.base[col],rows=[],ids={};
    S[col].forEach(r=>{ids[r.id]=1;if(base[r.id]!==canon(r))rows.push({owner_id:uid,id:r.id,data:r,updated_at:now,deleted:false});});
    Object.keys(base).forEach(id=>{if(!ids[id])rows.push({owner_id:uid,id:id,data:JSON.parse(base[id]),updated_at:now,deleted:true});});
    for(let i=0;i<rows.length;i+=100)await upsert(table,rows.slice(i,i+100),'owner_id,id');
    rows.forEach(rw=>{if(rw.deleted)delete base[rw.id];else base[rw.id]=canon(rw.data);});
  }
  const cs=canon(settingsForSync());
  if(cs!==syncState.base.settings){
    await upsert('genz_settings',[{owner_id:uid,data:settingsForSync(),updated_at:now}],'owner_id');

async function pullAll(){
  let changed=false;
  for(const c of COLS){
    const col=c[0],base=syncState.base[col];
    const rows=await getAll(c[1],'id,data,deleted','id.asc');
    for(const row of rows){
      const idx=S[col].findIndex(x=>x.id===row.id);
      const cur=idx>=0?S[col][idx]:null;
      const dirty=cur&&base[row.id]!==canon(cur);
      if(row.deleted){
        if(cur&&!dirty){S[col].splice(idx,1);changed=true;}
        if(!dirty)delete base[row.id];
        continue;
      }
      const rj=canon(row.data);
      if(!cur){S[col].push(row.data);base[row.id]=rj;changed=true;}
      else if(!dirty&&canon(cur)!==rj){S[col][idx]=row.data;base[row.id]=rj;changed=true;}
    }
  }
  const st=await getAll('genz_settings','data','');
  if(st.length&&canon(settingsForSync())===syncState.base.settings){
    const rj=canon(st[0].data);
    if(rj!==syncState.base.settings){S.settings=Object.assign({},S.settings,st[0].data);syncState.base.settings=canon(settingsForSync());changed=true;}
  }
  if(changed){await store.set('inv-data',JSON.stringify(S));render();}
}

function updateSyncbar(){

  else if(syncStatus==='error'){d='err';t=syncMsg||'No se pudo sincronizar. Toca para reintentar.';}

function failSync(e){
  if(e&&(e.name==='AuthError'||e.status===401)){setSync('auth');return;}
  if(e instanceof TypeError||!navigator.onLine){setSync('offline');return;}
  let m='No se pudo sincronizar. Toca para reintentar.';
  if(e&&(e.status===403||e.code==='42501'))m='Tu usuario no está autorizado en Gen Z. Falta el último paso del script SQL.';
  else if(e&&(e.code==='PGRST205'||e.code==='42P01'||e.status===404))m='Faltan las tablas de Gen Z en Supabase. Ejecuta el script SQL.';
  setSync('error',m);

/* ---------- reglas de negocio ---------- */
const prod=id=>S.products.find(p=>p.id===id);
function roundUp(x){const st=num(S.settings.round)||0.01;return +(Math.ceil(x/st-1e-9)*st).toFixed(2);}
function minPrice(cost){return cost>0?roundUp(cost*(num(S.settings.mult)||2)):0;}

const LB=0.45359237;
const curLabel=c=>c==='%'?'% del valor':c==='USD/lb'?'USD por lb':c==='USD/kg'?'USD por kg':c;
function calcOrder(o){
  const rate=num(o.rate)||num(S.settings.rate)||0;
  const wu=o.wUnit==='lb'?LB:1;
  const items=o.items;
  const goods=sum(items,i=>num(i.qty)*num(i.price));
  const weights=items.map(i=>num(i.qty)*num(i.weight)*wu);
  const totalW=sum(weights,w=>w);
  const lotKg=num(o.lotWeight)>0?num(o.lotWeight)*wu:totalW;
  const totalQty=sum(items,i=>num(i.qty));
  let method=o.method;
  if(method==='peso'&&totalW<=0)method='valor';
  const exp=o.expenses.map(e=>{
    let v=0,missing=false,missingW=false;
    if(e.cur==='%')v=goods*num(e.amount)/100;
    else if(e.cur==='CUP'){if(rate>0)v=num(e.amount)/rate;else if(num(e.amount)>0)missing=true;}
    else if(e.cur==='USD/lb'||e.cur==='USD/kg'){if(lotKg>0)v=num(e.amount)*(e.cur==='USD/lb'?lotKg/LB:lotKg);else if(num(e.amount)>0)missingW=true;}
    else v=num(e.amount);
    return {stage:e.stage,usd:v,missing:missing,missingW:missingW};
  });
  const extra=sum(exp,e=>e.usd);
  const byStage={};
  exp.forEach(e=>{byStage[e.stage]=(byStage[e.stage]||0)+e.usd;});
  const rows=items.map((i,k)=>{
    const qty=num(i.qty),val=qty*num(i.price);
    let share=0;
    if(method==='valor')share=goods>0?val/goods:0;
    else if(method==='peso')share=totalW>0?weights[k]/totalW:0;
    else share=totalQty>0?qty/totalQty:0;
    const alloc=extra*share;
    const unitProduct=num(i.price);
    const unitExtra=qty>0?alloc/qty:0;
    return {qty,unitProduct,unitExtra,unitCost:unitProduct+unitExtra,alloc};
  });
  return {rate,goods,extra,total:goods+extra,byStage,rows,method,lotKg,fellBack:o.method==='peso'&&method!=='peso',missingRate:exp.some(e=>e.missing),missingWeight:exp.some(e=>e.missingW)};
}

function receiveOrder(o){
  const c=calcOrder(o);
  o.items.forEach((it,k)=>{
    const r=c.rows[k];if(r.qty<=0)return;
    let p=it.productId?prod(it.productId):null;
    if(!p)p=matchProduct(it.name);
    if(!p){
      p={id:uid(),name:it.name.trim(),sku:'',category:(it.category||'').trim(),stock:0,cost:0,price:0,min:0,imgId:null,history:[]};
      S.products.push(p);
    }
    const ns=p.stock+r.qty;
    p.cost=ns>0?((p.stock*p.cost)+r.qty*r.unitCost)/ns:r.unitCost;
    p.stock=ns;
    const mn=minPrice(p.cost);
    if(!p.price||p.price<mn)p.price=mn;
    if(it.imgId&&!p.imgId)p.imgId=it.imgId;
    if(!p.category&&it.category)p.category=it.category.trim();
    p.history.unshift({date:o.date,order:o.name,qty:r.qty,unitProduct:r.unitProduct,unitExtra:r.unitExtra,unitCost:r.unitCost});
  });
  o.status='recibido';
  o.receivedAt=today();
  o.snapshot={goods:c.goods,extra:c.extra,total:c.total,byStage:c.byStage};
}
function matchProduct(txt){
  const t=String(txt||'').trim().toLowerCase();if(!t)return null;
  return S.products.find(p=>p.name.toLowerCase()===t||(p.sku&&p.sku.toLowerCase()===t))||null;
}

let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3200);}
let armedKey=null,armedT;
function armed(k,msg){
  if(armedKey===k){armedKey=null;clearTimeout(armedT);return true;}
  armedKey=k;clearTimeout(armedT);armedT=setTimeout(()=>{armedKey=null;},4000);
  toast(msg||'Toca otra vez para confirmar');return false;
}
function imgTag(id,name){

/* Resumen */
function viewSummary(){
  const per=ui.period;
  const from=per==='all'?'0000-00-00':dateAdd(today(),-(+per-1));
  const L=S.sales.filter(s=>s.date>=from);
  const rev=sum(L,s=>s.qty*s.price),cost=sum(L,s=>s.qty*s.cost),gain=rev-cost,mg=rev>0?gain/rev*100:0;
  let h='<div class="chips">'+[['1','Hoy'],['7','7 días'],['30','30 días'],['all','Todo']].map(x=>'<button class="chip'+(per===x[0]?' on':'')+'" data-act="period" data-p="'+x[0]+'">'+x[1]+'</button>').join('')+'</div>';
  h+='<div class="kpis"><div class="kpi"><small>Ventas</small><b>'+usd(rev)+'</b></div>'+
     '<div class="kpi"><small>Costo de lo vendido</small><b>'+usd(cost)+'</b></div>'+
     '<div class="kpi '+(gain>=0?'good':'bad')+'"><small>Ganancia</small><b>'+usd(gain)+'</b></div>'+
     '<div class="kpi"><small>Margen</small><b>'+mg.toFixed(0)+'%</b></div></div>';
  const days=[];
  for(let i=6;i>=0;i--){const d=dateAdd(today(),-i);days.push([d,sum(S.sales.filter(s=>s.date===d),s=>s.qty*s.price)]);}
  const mx=Math.max.apply(null,days.map(d=>d[1]).concat([1]));
  h+='<div class="card"><b>Ventas de los últimos 7 días</b><div class="bars">'+days.map(d=>{
    const p=d[0].split('-').map(Number);const lb=new Date(p[0],p[1]-1,p[2]).toLocaleDateString('es',{weekday:'short'}).slice(0,3);
    return '<div><span style="height:'+Math.max(2,d[1]/mx*90)+'px"></span>'+lb+'</div>';}).join('')+'</div></div>';
  const tp={};L.forEach(s=>{const k=s.pid||s.name;tp[k]=tp[k]||{name:s.name,q:0,g:0};tp[k].q+=s.qty;tp[k].g+=s.qty*(s.price-s.cost);});
  const top=Object.keys(tp).map(k=>tp[k]).sort((a,b)=>b.q-a.q).slice(0,5);
  if(top.length)h+='<div class="card"><b>Más vendidos</b>'+top.map(t=>'<div class="sale"><span>'+esc(t.name)+'</span><span>'+int(t.q)+' u · '+usd(t.g)+'</span></div>').join('')+'</div>';
  const low=S.products.filter(p=>p.stock<=p.min).sort((a,b)=>a.stock-b.stock).slice(0,8);
  if(low.length)h+='<div class="card"><b>Por reponer</b>'+low.map(p=>'<button class="pick" style="margin-top:8px" data-act="open-product" data-id="'+p.id+'"><span>'+esc(p.name)+'</span><span class="num">'+int(p.stock)+' u</span></button>').join('')+'</div>';
  const inv=sum(S.products,p=>p.stock*p.cost),val=sum(S.products,p=>p.stock*p.price);
  h+='<div class="card"><b>Dinero en inventario</b><div class="sale"><span>Invertido (al costo)</span><span>'+usd(inv)+'</span></div><div class="sale"><span>Valor de venta</span><span>'+usd(val)+'</span></div><div class="sale"><span>Ganancia potencial</span><span><b>'+usd(val-inv)+'</b></span></div></div>';
  return h;
}

function ladder(c){
  const segs=[['prod','Productos',c.goods]].concat(STAGES.map(s=>[s[0],s[1],c.byStage[s[0]]||0])).filter(s=>s[2]>0);
  const tot=sum(segs,s=>s[2])||1;
  return '<div class="ladder">'+segs.map(s=>'<span style="flex:'+(s[2]/tot)+';background:var(--s-'+s[0]+')" title="'+s[1]+'"></span>').join('')+'</div>'+
    '<ul class="legend">'+segs.map(s=>'<li><i style="background:var(--s-'+s[0]+')"></i><span>'+s[1]+'</span><b>'+usd(s[2])+'</b></li>').join('')+'</ul>';
}
function summaryHTML(D,c){
  let h='';

  h+=ladder(c);
  h+='<div class="total"><span>Costo total del pedido</span><b>'+usd(c.total)+'</b></div>';
  if(c.goods>0)h+='<p class="hint" style="margin:8px 0 0">Cada $1.00 en productos te cuesta '+usd(c.total/c.goods)+' puesto en Cuba.</p>';
  if(c.lotKg>0)h+='<p class="hint" style="margin:4px 0 0">Peso del lote: '+(c.lotKg/LB).toFixed(1)+' lb ('+c.lotKg.toFixed(1)+' kg)</p>';

  if(c.fellBack)h+='<p class="warn">No hay pesos por producto, así que los gastos se repartieron según el valor de cada uno.</p>';
  return h;
}

}
function openOrderModal(d){ui.draft=d;ui.modal='order';renderModal();updOrder();}

function validateOrder(D,strict){
  if(!D.items.length)return 'Agrega al menos un producto.';
  if(strict){
    for(const it of D.items){
      if(!it.name.trim())return 'Hay un producto sin nombre.';
      if(num(it.qty)<=0)return 'Revisa la cantidad de "'+it.name+'".';
      if(num(it.price)<=0)return 'Escribe el precio de "'+it.name+'".';
    }
    if(calcOrder(D).missingRate)return 'Hay gastos en CUP: escribe la tasa de CUP por 1 USD.';
    if(calcOrder(D).missingWeight)return 'Hay gastos por libra o kilo: escribe el peso total del lote.';
  }
  return '';
}
function commitOrder(D){
  const o=clone(D);delete o.isNew;
  if(!o.name.trim())o.name='Pedido del '+fmtDate(o.date);
  o.items.forEach(i=>{i.productId=i.productId&&prod(i.productId)?i.productId:null;});
  const k=S.orders.findIndex(x=>x.id===o.id);
  if(k>=0)S.orders[k]=o;else S.orders.push(o);
  return o;
}

const A={
  tab(t){ui.tab=t.dataset.tab;render();window.scrollTo(0,0);},

  'open-login'(){closeModal();openLogin();},

  async logout(){

    const n=dirtyCount();
    if(!armed('logout',n>0?'Hay '+n+' cambio'+(n===1?'':'s')+' sin subir. Toca otra vez para cerrar sesión y perderlos':'Toca otra vez para cerrar sesión. Los datos de este teléfono se borran; en la nube siguen guardados'))return;
    Object.keys(imgs).forEach(id=>{store.set('img:'+id,'');delete imgs[id];});
    const th=S.settings.theme;

    await store.set('inv-data',JSON.stringify(S));await store.set('session','');await store.set('sync-meta',JSON.stringify(syncState));await store.set('local-only','0');
    closeModal();render();updateSyncbar();openLogin();
  },
  async install(){if(!deferredInstall)return toast('Abre el menú del navegador y elige "Instalar app" o "Agregar a pantalla de inicio".');deferredInstall.prompt();try{await deferredInstall.userChoice;}catch(e){}deferredInstall=null;},
  'toggle-theme'(){S.settings.theme=effTheme()==='dark'?'light':'dark';save();applyTheme();},
  settings(){ui.sdraft=clone(S.settings);ui.modal='set';renderModal();},
  close(){closeModal();},
  'save-settings'(){
    const T=ui.sdraft;const m=num(T.mult);
    if(m<1)return toast('El multiplicador debe ser 1 o más.');
    S.settings={name:(T.name||'').trim()||'Gen Z',mult:m,rate:num(T.rate),round:T.round,theme:T.theme||'auto'};
    save();closeModal();render();toast('Ajustes guardados');
  },
  'raise-prices'(){
    if(!armed('raise','Toca otra vez para subir los precios bajos'))return;
    const T=ui.sdraft;const m=num(T.mult)||2;const keep=S.settings;
    S.settings=Object.assign({},keep,{mult:m,round:T.round});
    let n=0;S.products.forEach(p=>{const mn=minPrice(p.cost);if(p.cost>0&&p.price<mn){p.price=mn;n++;}});
    S.settings=keep;save();toast(n?n+' precio'+(n===1?'':'s')+' actualizado'+(n===1?'':'s'):'Todos los precios ya cumplen el mínimo');
  },

  async 'copy-backup'(){
    const ids=new Set();S.products.forEach(p=>p.imgId&&ids.add(p.imgId));S.orders.forEach(o=>o.items.forEach(i=>i.imgId&&ids.add(i.imgId)));
    const im={};for(const id of ids){const v=await getImg(id);if(v)im[id]=v;}
    const txt=JSON.stringify({app:'inv-musical',v:1,data:S,imgs:im});
    const ta=$('#bk');if(ta){ta.value=txt;ta.focus();ta.select();}
    try{await navigator.clipboard.writeText(txt);toast('Copia lista en el portapapeles');}catch(e){toast('Copia el texto que apareció en el cuadro');}
  },
  async 'restore-backup'(){
    const ta=$('#bk');let d;
    try{d=JSON.parse((ta.value||'').trim());}catch(e){return toast('El texto no es una copia válida.');}
    if(!d||d.app!=='inv-musical'||!d.data)return toast('El texto no es una copia válida.');
    if(!armed('restore','Esto reemplaza tus datos actuales. Toca otra vez para restaurar'))return;
    S={settings:Object.assign({name:'Gen Z',mult:2,rate:0,round:'0.5',theme:'auto'},d.data.settings||{}),products:d.data.products||[],orders:d.data.orders||[],sales:d.data.sales||[]};
    const im=d.imgs||{};for(const id of Object.keys(im)){imgs[id]=im[id];await store.set('img:'+id,im[id]);}
    save();closeModal();render();toast('Copia restaurada');
  },

  /* productos */
  'new-product'(){ui.pdraft={isNew:true,name:'',sku:'',category:'',stock:'',min:'',cost:'',price:'',imgId:null,history:[]};ui.modal='prod';renderModal();updProd();},
  'open-product'(t){const p=prod(t.dataset.id);if(!p)return;ui.pdraft=Object.assign(clone(p),{isNew:false});ui.modal='prod';renderModal();updProd();},
  'save-product'(){
    const P=ui.pdraft;const name=P.name.trim();
    if(!name)return toast('Escribe el nombre del producto.');
    const cost=num(P.cost),stock=Math.max(0,Math.round(num(P.stock)));
    const mn=minPrice(cost);let price=num(P.price);
    if(price<=0)price=mn;
    if(cost>0&&price<mn-0.001)return toast('El precio mínimo es '+usd(mn)+' (costo × '+(num(S.settings.mult)||2)+').');
    let p=P.isNew?null:prod(P.id);
    if(!p){p={id:uid(),history:[]};S.products.push(p);if(stock>0)p.history.push({date:today(),order:'Ingreso manual',qty:stock,unitProduct:cost,unitExtra:0,unitCost:cost});}
    Object.assign(p,{name:name,sku:(P.sku||'').trim(),category:(P.category||'').trim(),stock:stock,min:Math.max(0,Math.round(num(P.min))),cost:cost,price:price,imgId:P.imgId||null});
    save();closeModal();render();toast('Producto guardado');
  },
  'delete-product'(){
    if(!armed('delprod','Toca otra vez para eliminar el producto'))return;
    S.products=S.products.filter(p=>p.id!==ui.pdraft.id);save();closeModal();render();toast('Producto eliminado');
  },
  'photo-prod'(){pending={type:'prod'};$('#file').click();},
  'photo-item'(t){pending={type:'item',i:+t.dataset.i};$('#file').click();},

  /* pedidos */
  'new-order'(){openOrderModal(newOrderDraft());},

  'open-order'(t){const o=S.orders.find(x=>x.id===t.dataset.id);if(o)openOrderModal(Object.assign(clone(o),{isNew:false}));},
  'add-item'(){ui.draft.items.push(blankItem());renderModal();updOrder();const L=document.querySelectorAll('.icard input[data-namefield]');if(L.length)L[L.length-1].focus();},
  'del-item'(t){ui.draft.items.splice(+t.dataset.i,1);renderModal();updOrder();},
  'add-exp'(){ui.draft.expenses.push(blankExp('otro'));renderModal();updOrder();const L=document.querySelectorAll('#exps .erow');if(L.length)L[L.length-1].scrollIntoView({block:'center'});},
  'del-exp'(t){ui.draft.expenses.splice(+t.dataset.i,1);renderModal();updOrder();},
  'save-order'(){
    const D=ui.draft;const e=validateOrder(D,false);if(e)return toast(e);
    commitOrder(D);save();closeModal();ui.tab='ord';render();toast('Pedido guardado');
  },
  'receive-order'(){
    const D=ui.draft;const e=validateOrder(D,true);if(e)return toast(e);
    if(!armed('recv','Toca otra vez para meter los productos al inventario'))return;
    const o=commitOrder(D);receiveOrder(o);save();closeModal();ui.tab='inv';ui.q='';ui.filter='all';render();toast('Pedido recibido: el inventario ya está actualizado');
  },

  /* ventas */
  'add-line'(t){
    const p=prod(t.dataset.id);if(!p)return;
    const R=ui.report;const ex=R.lines.find(l=>l.pid===p.id);
    if(ex){if(ex.qty<p.stock)ex.qty++;}else R.lines.push({pid:p.id,qty:1,price:p.price});
    R.q='';const q=$('#rq');if(q)q.value='';renderReportBits();
  },
  'line-inc'(t){const l=ui.report.lines[+t.dataset.i];const p=prod(l.pid);if(l.qty<p.stock)l.qty++;else toast('No hay más unidades en stock.');renderReportLines();},
  'line-dec'(t){const l=ui.report.lines[+t.dataset.i];if(l.qty>1)l.qty--;renderReportLines();},
  'del-line'(t){ui.report.lines.splice(+t.dataset.i,1);renderReportBits();},
  'save-report'(){
    const R=ui.report;
    if(!R.lines.length)return toast('Agrega al menos un producto vendido.');
    for(const l of R.lines){
      const p=prod(l.pid);if(!p)return toast('Un producto ya no existe.');
      if(num(l.qty)<=0)return toast('Revisa la cantidad de "'+p.name+'".');
      if(num(l.qty)>p.stock)return toast('De "'+p.name+'" solo quedan '+int(p.stock)+'.');
      if(num(l.price)<=0)return toast('Escribe el precio de "'+p.name+'".');
    }
    R.lines.forEach(l=>{const p=prod(l.pid);const q=num(l.qty);p.stock-=q;S.sales.push({id:uid(),date:R.date,pid:p.id,name:p.name,qty:q,price:num(l.price),cost:p.cost});});
    R.lines=[];save();render();toast('Informe guardado. El stock ya se descontó.');
  },
  'del-sale'(t){
    if(!armed('sale'+t.dataset.id,'Toca otra vez para anular esta venta y devolver el stock'))return;
    const k=S.sales.findIndex(s=>s.id===t.dataset.id);if(k<0)return;
    const s=S.sales[k];const p=prod(s.pid);if(p)p.stock+=s.qty;
    S.sales.splice(k,1);save();render();toast('Venta anulada');
  }
};

/* ---------- eventos ---------- */
let pending=null;
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;const f=A[t.dataset.act];if(f)f(t,e);});

function setPath(obj,path,val){
  const p=path.split('.');let o=obj;
  for(let k=0;k<p.length-1;k++)o=o[p[k]];
  o[p[p.length-1]]=val;
}
function onInput(e){
  const t=e.target;
  if(t.dataset.scope){
    const obj={order:ui.draft,prod:ui.pdraft,set:ui.sdraft,login:ui.ldraft}[t.dataset.scope];
    if(!obj)return;
    setPath(obj,t.dataset.bind,t.value);
    if(t.dataset.scope==='order')updOrder();
    if(t.dataset.scope==='prod')updProd();
    return;
  }
  if(t.id==='q-inv'){ui.q=t.value;renderList();return;}
  if(t.id==='rq'){ui.report.q=t.value;renderReportResults();updReportFoot();return;}
  if(t.id==='rdate'){if(t.value)ui.report.date=t.value;return;}
  if(t.dataset.line!==undefined){
    const i=+t.dataset.line;const l=ui.report.lines[i];if(!l)return;
    l[t.dataset.field]=t.dataset.field==='qty'?Math.max(0,Math.round(num(t.value))):t.value;
    updLine(i);updReportFoot();
  }
}
document.addEventListener('input',onInput);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.scope==='login'){e.preventDefault();A.login();}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='file'){handleFile(t);return;}
  onInput(e);
  if(t.dataset.bind==='wUnit'&&ui.draft){renderModal();updOrder();return;}
  if(t.dataset.namefield!==undefined&&ui.draft){
    const i=+t.dataset.namefield;const it=ui.draft.items[i];const p=matchProduct(it.name);
    it.productId=p?p.id:null;
    if(p){
      if(!it.category&&p.category){it.category=p.category;const c=document.querySelector('[data-bind="items.'+i+'.category"]');if(c)c.value=p.category;}
      if(!it.imgId&&p.imgId){it.imgId=p.imgId;const th=document.querySelector('[data-thumb="'+i+'"]');if(th)th.innerHTML=imgTag(p.imgId,p.name);}
    }
    const b=$('#ib-'+i);if(b)b.textContent=p?'Ya está en tu inventario · quedan '+int(p.stock):(it.name.trim()?'Producto nuevo':'Escribe el nombre o elige uno existente');
  }
});

/* ---------- fotos ---------- */
function shrink(file){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const k=Math.min(1,520/Math.max(im.width,im.height));
        const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        res(c.toDataURL('image/jpeg',0.72));
      };
      im.onerror=rej;im.src=fr.result;
    };
    fr.onerror=rej;fr.readAsDataURL(file);
  });
}
async function handleFile(inp){
  const f=inp.files&&inp.files[0];inp.value='';
  if(!f||!pending)return;
  const ctx=pending;pending=null;
  try{
    const url=await shrink(f);const id=uid();
    imgs[id]=url;await store.set('img:'+id,url);
    if(ctx.type==='item'&&ui.draft&&ui.draft.items[ctx.i]){
      ui.draft.items[ctx.i].imgId=id;
      const th=document.querySelector('[data-thumb="'+ctx.i+'"]');if(th)th.innerHTML=imgTag(id,ui.draft.items[ctx.i].name);
    }else if(ctx.type==='prod'&&ui.pdraft){
      ui.pdraft.imgId=id;const th=$('#pthumb');if(th)th.innerHTML=imgTag(id,ui.pdraft.name);
    }
  }catch(e){console.error(e);toast('No se pudo cargar la foto. Prueba con otra.');}
}

applyTheme();

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;});
window.addEventListener('appinstalled',()=>{deferredInstall=null;});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
try{if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js');}catch(e){}
load();
})();
