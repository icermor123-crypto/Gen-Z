<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006d79"><link rel="manifest" href="manifest.webmanifest"><title>Gen Z Tienda</title><script src="config.js"></script></head><body><main style="font:16px system-ui;max-width:600px;margin:12vh auto;padding:24px"><h1>Gen Z Tienda</h1><p id="status">Abriendo la tienda…</p><p>Enlaces directos: <a href="admin.html">Administración</a> · <a href="manager.html">Gestores</a></p><script>const q=new URLSearchParams(location.search),slug=q.get('store')||(window.GENZ_CONFIG?.defaultStoreSlug!=='TU-IDENTIFICADOR'?window.GENZ_CONFIG?.defaultStoreSlug:null);if(slug){const p=new URLSearchParams({store:slug});if(q.get('ref'))p.set('ref',q.get('ref'));location.replace('store.html?'+p.toString())}else document.querySelector('#status').textContent='La tienda no está configurada aún. El administrador puede entrar al panel para crearla.';if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});</script></main></body></html>
