<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006d79"><meta name="description" content="Compra en nuestra tienda online."><title>Tienda online | Gen Z</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="stylesheet" href="styles.css"><script src="./vendor/supabase.js"></script><script src="config.js"></script><script src="common.js"></script></head><body><div class="wrap"><div id="app" aria-live="polite"></div></div><script>
(async()=>{const app=$('#app');if(!ready){app.innerHTML=header()+`<section class="panel"><h1>La tienda aún no está configurada</h1><p>El administrador debe completar config.js y ejecutar el esquema de Supabase.</p></section>`;return}const params=new URLSearchParams(location.search),defaultSlug=window.GENZ_CONFIG?.defaultStoreSlug,slug=params.get('store')||(defaultSlug&&defaultSlug!=='TU-IDENTIFICADOR'?defaultSlug:null),ref=params.get('ref')||null;const makeKey=()=>globalThis.crypto?.randomUUID?.()||(`${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`),cartKey=`gz-cart:${slug}:${ref||'own'}`,draftKey=`gz-draft:${slug}:${ref||'own'}`,requestStorageKey=`gz-request:${slug}:${ref||'own'}`,resultKey=`gz-result:${slug}:${ref||'own'}`;let catalog,cart=new Map(),busy=false,lastResult=null,fulfillment='online_pickup',search='',category='all',formDraft={};try{cart=new Map(JSON.parse(sessionStorage.getItem(cartKey)||'[]'));formDraft=JSON.parse(sessionStorage.getItem(draftKey)||'{}');lastResult=JSON.parse(sessionStorage.getItem(resultKey)||'null')}catch{cart=new Map()}
function render(){if(!catalog)return;const s=catalog.store,manager=catalog.manager;const deliveryFee=fulfillment==='delivery'?Number(s.delivery_fee||0):0;document.title=s.name+' | Tienda online';$('meta[name="description"]').content=(s.description||'Compra productos en '+s.name).slice(0,155);const allProds=catalog.products||[];const total=[...cart].reduce((sum,[id,q])=>sum+q*Number(allProds.find(p=>p.id===id)?.price||0),0);const count=[...cart.values()].reduce((sum,q)=>sum+q,0);const categories=[...new Set(allProds.map(p=>p.category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));const prods=allProds.filter(p=>(!search||(`${p.name} ${p.description} ${p.category}`).toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(search.toLocaleLowerCase('es').normalize('NFD').replace(/[\u0300-\u036f]/g,'')))&&(category==='all'||p.category===category));app.innerHTML=`${header(s.name)}${lastResult?`<section class="notice success" role="status" aria-live="polite"><strong>Pedido ${esc(lastResult.order_code)} recibido.</strong> Total: ${money(lastResult.customer_total,lastResult.currency)}. Pendiente de confirmación.${lastResult.whatsapp?` <a href="https://wa.me/${encodeURIComponent(lastResult.whatsapp)}?text=${encodeURIComponent(`Hola, hice el pedido ${lastResult.order_code}. Mi nombre es ${lastResult.buyerName}; teléfono: ${lastResult.buyerPhone}. Modalidad: ${lastResult.fulfillment==='delivery'?'domicilio':'recogida'}.${lastResult.buyerAddress?' Dirección: '+lastResult.buyerAddress+'.':''}${lastResult.fulfillment==='delivery'&&lastResult.delivery_fee?' Entrega: '+money(lastResult.delivery_fee,lastResult.currency)+'.':''}${lastResult.fulfillment==='online_pickup'&&s.pickup_address?' Recogida en: '+s.pickup_address+(s.opening_hours?' ('+s.opening_hours+')':'')+'.':''} Productos: ${lastResult.items.map(i=>i.quantity+' x '+i.name+' ('+money(i.price,lastResult.currency)+')').join('; ')}. Total: ${money(lastResult.customer_total,lastResult.currency)}. Por favor confirmen disponibilidad y forma de pago.`)}" target="_blank" rel="noopener">Avisar por WhatsApp</a>`:''}</section>`:''}<main><section class="panel"><h1>${esc(s.name)}</h1><p>${esc(s.description||'Compra fácil y directa.')}</p>${manager?`<p class="badge">Atendido por ${esc(manager.name)}</p>`:''}<p class="muted"><strong>Recoger:</strong> ${esc(s.pickup_address||'Coordinar dirección con la tienda')} · ${esc(s.opening_hours||'Horario por confirmar')}</p>${s.delivery_enabled?`<p class="muted"><strong>Domicilio disponible</strong> · ${money(s.delivery_fee,s.currency)}${s.delivery_eta?' · '+esc(s.delivery_eta):''}${s.delivery_zones?' · Zonas: '+esc(s.delivery_zones):''}</p>`:''}${s.whatsapp?`<p class="muted">Consultas por <a href="https://wa.me/${encodeURIComponent(s.whatsapp)}">WhatsApp</a></p>`:''}</section><section><h2>Productos</h2><label>Buscar productos<input id="searchProducts" type="search" placeholder="Nombre o descripción" value="${esc(search)}"></label><label>Filtrar por categoría<select id="categoryFilter"><option value="all">Todas las categorías</option>${categories.map(c=>`<option value="${esc(c)}" ${category===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label><div class="grid">${prods.map(p=>{const q=cart.get(p.id)||0;return `<article class="card product">${p.image_url?`<img loading="lazy" src="${esc(p.image_url)}" alt="${esc(p.name)}" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'image-placeholder',textContent:'Gen Z'}))">`:`<div class="image-placeholder" role="img" aria-label="Imagen pendiente para ${esc(p.name)}">Gen Z</div>`}<div class="pbody"><h3>${esc(p.name)}</h3><p class="muted">${esc(p.description)}</p><p class="total">${money(p.price,s.currency)}</p><p class="muted">Disponibles: ${p.stock}</p><div class="actions">${q?`<div class="qty"><button data-remove="${p.id}" aria-label="Quitar una unidad de ${esc(p.name)}">−</button><span aria-label="Cantidad">${q}</span><button data-add="${p.id}" aria-label="Agregar una unidad de ${esc(p.name)}" ${q>=p.stock?'disabled':''}>+</button></div>`:`<button class="primary" data-add="${p.id}">Agregar al pedido</button>`}</div></div></article>`}).join('')||'<p class="muted">No hay productos disponibles en este momento.</p>'}</div></section>${count?`<section class="panel"><h2>Tu pedido</h2><fieldset><legend>¿Cómo quieres recibirlo?</legend><label><input type="radio" name="fulfillment" value="online_pickup" ${fulfillment==='online_pickup'?'checked':''}> Recoger en el local</label>${s.delivery_enabled?`<label><input type="radio" name="fulfillment" value="delivery" ${fulfillment==='delivery'?'checked':''}> A domicilio · ${money(s.delivery_fee,s.currency)}</label>`:''}</fieldset><div>${allProds.filter(p=>cart.get(p.id)).map(p=>`<div class="row"><div>${esc(p.name)} × ${cart.get(p.id)}</div><strong>${money(cart.get(p.id)*Number(p.price),s.currency)}</strong></div>`).join('')}</div>${deliveryFee?`<div class="row"><span>Entrega</span><strong>${money(deliveryFee,s.currency)}</strong></div>`:''}<div class="row"><strong>Total del pedido</strong><span class="total">${money(total+deliveryFee,s.currency)}</span></div><p class="muted">La solicitud queda pendiente hasta que la tienda confirme. Al registrarla aparecerá un botón para abrir WhatsApp con el texto listo; tendrás que enviarlo allí.</p>${s.whatsapp?'':`<p class="notice error" role="alert">La tienda aún no configuró WhatsApp. No envíes el pedido; contacta al negocio por otro canal.</p>`}<form id="checkout"><label>Tu nombre<input name="name" required minlength="2" maxlength="120" autocomplete="name" value="${esc(formDraft.name||'')}"></label><label>Teléfono de contacto<input name="phone" type="tel" required minlength="6" maxlength="40" autocomplete="tel" value="${esc(formDraft.phone||'')}"></label>${fulfillment==='delivery'?`<label>Dirección de entrega<input name="address" required minlength="6" maxlength="800" autocomplete="street-address" value="${esc(formDraft.address||'')}"></label>`:''}<label>Nota (opcional)<textarea name="note" maxlength="1000">${esc(formDraft.note||'')}</textarea></label><button class="primary" ${busy||!s.whatsapp?'disabled':''}>${busy?'Enviando…':'Preparar pedido en WhatsApp'}</button></form><p id="result" role="status" aria-live="polite"></p></section>`:''}</main><footer>Los precios y la disponibilidad se confirman al coordinar el pedido.</footer>`;}
app.addEventListener('input',e=>{if(e.target.form?.id==='checkout'&&e.target.name){formDraft[e.target.name]=e.target.value;sessionStorage.setItem(draftKey,JSON.stringify(formDraft))}if(e.target.id==='searchProducts'){search=e.target.value;render();const n=$('#searchProducts');n?.focus();n?.setSelectionRange(search.length,search.length);}});app.addEventListener('change',e=>{if(e.target.name==='fulfillment'){fulfillment=e.target.value;render();}if(e.target.id==='categoryFilter'){category=e.target.value;render();}});
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.add||b.dataset.remove;if(!id)return;const p=catalog.products.find(x=>x.id===id);if(!p)return;if(b.dataset.add){const q=cart.get(id)||0;if(q<p.stock)cart.set(id,q+1)}else{const q=(cart.get(id)||0)-1;if(q<=0)cart.delete(id);else cart.set(id,q)}sessionStorage.setItem(cartKey,JSON.stringify([...cart]));render();});
app.addEventListener('submit',async e=>{
 if(e.target.id!=='checkout')return;e.preventDefault();if(busy)return;
 const f=new FormData(e.target),items=[...cart].map(([product_id,quantity])=>({product_id,quantity}));
 const payload=JSON.stringify({store:slug,ref,name:f.get('name'),phone:f.get('phone'),note:f.get('note')||'',items,fulfillment,address:f.get('address')||''});
 let saved={};try{saved=JSON.parse(sessionStorage.getItem(requestStorageKey)||'{}')}catch{}
 const requestKey=saved.payload===payload?saved.key:makeKey();sessionStorage.setItem(requestStorageKey,JSON.stringify({key:requestKey,payload}));
 busy=true;render();
 try{
  const {data,error}=await db.rpc('gz_place_order',{p_store_slug:slug,p_manager_slug:ref,p_buyer_name:f.get('name'),p_buyer_phone:f.get('phone'),p_buyer_note:f.get('note')||'',p_items:items,p_fulfillment:fulfillment,p_delivery_address:f.get('address')||'',p_client_request_key:requestKey});
  if(error)throw error;
  lastResult={...data,buyerName:f.get('name'),buyerAddress:f.get('address')||'',buyerPhone:f.get('phone'),fulfillment,items:items.map(i=>{const p=catalog.products.find(x=>x.id===i.product_id);return {name:p?.name||'Producto',quantity:i.quantity,price:p?.price||0}})};sessionStorage.setItem(resultKey,JSON.stringify(lastResult));cart.clear();sessionStorage.removeItem(requestStorageKey);render();
 }catch(err){busy=false;render();const n=document.createElement('p');n.className='notice error';n.setAttribute('role','alert');n.textContent=errorText(err);$('#checkout')?.prepend(n);return}
 finally{busy=false}
});
try{if(!slug)throw new Error('Falta el identificador de tienda en el enlace.');const {data,error}=await db.rpc('gz_public_catalog',{p_slug:slug,p_manager_slug:ref});if(error)throw error;catalog=data;render()}catch(e){app.innerHTML=header('')+`<section class="panel"><h1>No se pudo abrir esta tienda</h1><p class="notice error" role="alert">${esc(errorText(e))}</p><a href="./">Volver</a></section>`}
})();
</script></body></html>
