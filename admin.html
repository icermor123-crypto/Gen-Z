async function loadData(){const {data:{session:s}}=await db.auth.getSession();session=s;if(!session){app.innerHTML=loginMarkup();return;}
 let r=await db.from('gz_stores').select('*').maybeSingle();if(r.error)throw r.error;store=r.data;
 if(store&&store.owner_id!==session.user.id){app.innerHTML=header('Acceso restringido')+`<div class="panel"><h1>Esta cuenta no administra la tienda</h1><p>Los gestores deben usar el panel de gestores.</p><button class="secondary" id="signout">Salir</button></div>`;store=null;return;}
 if(!store){render();return;}
 const [pr,mr,or,mv,pu,cs,ch]=await Promise.all([db.from('gz_products').select('*').eq('store_id',store.id).order('name'),db.from('gz_managers').select('*').eq('store_id',store.id).order('created_at',{ascending:false}),db.rpc('gz_owner_orders',{p_store_id:store.id,p_limit:500}),db.from('gz_stock_movements').select('*').eq('store_id',store.id).order('created_at',{ascending:false}).limit(100),db.from('gz_purchases').select('*').eq('store_id',store.id).order('created_at',{ascending:false}).limit(100),db.rpc('gz_cash_status',{p_store_id:store.id}),db.from('gz_cash_sessions').select('*').eq('store_id',store.id).order('opened_at',{ascending:false}).limit(15)]);
 if(pr.error)throw pr.error;if(mr.error)throw mr.error;if(or.error)throw or.error;if(mv.error)throw mv.error;if(pu.error)throw pu.error;if(cs.error)throw cs.error;if(ch.error)throw ch.error;cashStatus=cs.data||{open:false};cashSessions=ch.data||[];products=pr.data;managers=mr.data;orders=or.data;movements=mv.data;purchases=pu.data;if(orders.length){const {data:oi,error:oe}=await db.from('gz_order_items').select('*').in('order_id',orders.map(o=>o.id));if(oe)throw oe;orderItems=oi||[]}else orderItems=[];render();
}

 if(e.target.id==='purchaseForm'){if(purchaseBusy)return;const f=new FormData(e.target);if(!purchaseLines.length||purchaseLines.some(l=>!l.product_id||!Number.isInteger(Number(l.quantity))||Number(l.quantity)<1||!Number.isFinite(Number(l.unit_cost))||Number(l.unit_cost)<0))throw new Error('Completa producto, unidades y costo de cada línea.');purchaseBusy=true;const items=purchaseLines.map(l=>({product_id:l.product_id,quantity:Number(l.quantity),unit_cost:Number(l.unit_cost)})),payload=JSON.stringify({store:store.id,supplier:f.get('supplier'),note:f.get('note'),items,expenses:f.get('shared_expenses')});let saved={};try{saved=JSON.parse(sessionStorage.getItem('gz-purchase-request')||'{}')}catch{}const requestKey=saved.payload===payload?saved.key:crypto.randomUUID();sessionStorage.setItem('gz-purchase-request',JSON.stringify({key:requestKey,payload}));try{const {data,error}=await db.rpc('gz_receive_purchase',{p_store_id:store.id,p_supplier:f.get('supplier')||'',p_note:f.get('note')||'',p_items:items,p_shared_expenses:Number(f.get('shared_expenses')||0),p_request_key:requestKey});if(error)throw error;sessionStorage.removeItem('gz-purchase-request');await loadData();tab='purchases';render();msg(`Compra ${data.purchase_code} recibida: ${money(data.total_cost,store.currency)}. Costos promedios y existencias actualizados.`,'success');}finally{purchaseBusy=false}}
 if(e.target.id==='saleForm'){if(saleBusy)return;const items=saleLines.map(l=>({product_id:l.product_id,quantity:Number(l.quantity)}));if(!items.length||items.some(l=>!l.product_id||!Number.isInteger(l.quantity)||l.quantity<1))throw new Error('Añade productos y cantidades válidas.');saleBusy=true;const f=new FormData(e.target),payload=JSON.stringify({store:store.id,session:cashStatus.id,buyer:f.get('buyer_name'),method:f.get('payment_method'),cash:f.get('cash_received'),items});let saved={};try{saved=JSON.parse(sessionStorage.getItem('gz-sale-request')||'{}')}catch{}const requestKey=saved.payload===payload?saved.key:crypto.randomUUID();sessionStorage.setItem('gz-sale-request',JSON.stringify({key:requestKey,payload}));try{const {data,error}=await db.rpc('gz_record_local_sale',{p_store_id:store.id,p_cash_session_id:cashStatus.id,p_buyer_name:f.get('buyer_name')||'',p_payment_method:f.get('payment_method'),p_items:items,p_cash_received:f.get('payment_method')==='cash'&&f.get('cash_received')?Number(f.get('cash_received')):null,p_request_key:requestKey});if(error)throw error;sessionStorage.removeItem('gz-sale-request');await loadData();tab='caja';render();msg('Venta presencial '+data.order_code+' registrada: '+money(data.total,data.currency),'success');}finally{saleBusy=false}}
 if(e.target.id==='ownerLogin'){const f=new FormData(e.target);const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;await loadData();}
 if(e.target.id==='storeCreate'){const f=new FormData(e.target);const {data:{user}}=await db.auth.getUser();const {error}=await db.from('gz_stores').insert({owner_id:user.id,name:f.get('name').trim(),slug:f.get('slug').trim().toLowerCase(),description:f.get('description'),whatsapp:f.get('whatsapp').replace(/\D/g,''),pickup_address:f.get('pickup_address').trim(),opening_hours:f.get('opening_hours').trim(),delivery_enabled:f.get('delivery_enabled')==='on',delivery_fee:Number(f.get('delivery_fee')||0),delivery_zones:f.get('delivery_zones').trim(),delivery_eta:f.get('delivery_eta').trim(),currency:f.get('currency')});if(error)throw error;await loadData();}
 if(e.target.id==='productForm'){const f=new FormData(e.target);const initialStock=Math.max(0,Math.round(Number(f.get('stock')||0)));let imageUrl=f.get('image_url').trim();const image=f.get('image_file');if(image&&image.size){if(image.size>5242880)throw new Error('La imagen supera 5 MB.');if(!['image/jpeg','image/png','image/webp'].includes(image.type))throw new Error('Usa una imagen JPEG, PNG o WebP.');const ext=image.type==='image/jpeg'?'jpg':image.type.split('/')[1],path=`${store.id}/${crypto.randomUUID()}.${ext}`;const {error:uploadError}=await db.storage.from('gz-product-images').upload(path,image,{contentType:image.type,upsert:false});if(uploadError)throw uploadError;imageUrl=db.storage.from('gz-product-images').getPublicUrl(path).data.publicUrl;}if(imageUrl&&!/^https:\/\//i.test(imageUrl))throw new Error('La URL de imagen debe usar HTTPS.');const d={store_id:store.id,name:f.get('name').trim(),sku:f.get('sku').trim(),category:f.get('category').trim(),description:f.get('description').trim(),image_url:imageUrl,base_price:Number(f.get('base_price')),manager_floor:Number(f.get('manager_floor')||0),unit_cost:Number(f.get('unit_cost')),active:f.get('active')==='on',updated_at:new Date().toISOString()};if(f.get('id')){const {error}=await db.from('gz_products').update(d).eq('id',f.get('id'));if(error)throw error;}else{const {data:newProduct,error}=await db.from('gz_products').insert({...d,stock:0}).select('id').single();if(error)throw error;if(initialStock>0){const {error:stockError}=await db.rpc('gz_adjust_stock',{p_product_id:newProduct.id,p_delta:initialStock,p_movement_type:'restock',p_reason:'Existencia inicial al crear producto'});if(stockError)throw stockError;}}editing=null;await loadData();tab='products';render();msg('Producto guardado.','success');}
 if(e.target.id==='managerForm'){const f=new FormData(e.target);const {error}=await db.from('gz_managers').insert({store_id:store.id,name:f.get('name').trim(),email:f.get('email').trim().toLowerCase(),slug:f.get('slug').trim().toLowerCase()});if(error)throw error;await loadData();tab='managers';render();msg('Gestor creado. Pídele que se registre en manager.html y confirme su correo.','success');}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{
