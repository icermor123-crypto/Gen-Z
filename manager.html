<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#006d79"><title>Panel de gestor | Gen Z</title><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><script src="./vendor/supabase.js"></script><script src="config.js"></script><script src="common.js"></script></head><body><div class="wrap"><div id="app" aria-live="polite"></div><footer>Tu enlace identifica tus ventas. No compartas tu contraseña ni intentes usar el enlace de otro gestor.</footer></div><script>
(async()=>{const app=$('#app');if(!ready){app.innerHTML=header('Gestores')+`<div class="panel"><h1>Conecta Supabase</h1><p>Completa config.js y ejecuta supabase/schema.sql antes de usar el panel.</p></div>`;return}let manager=null,store=null,products=[],catalog=null,orders=[];function auth(){app.innerHTML=header('Acceso de gestor')+`<div id="notice" class="notice" hidden></div><div class="two"><section class="panel"><h1>Entra a tu cuenta</h1><form id="login"><label>Correo<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Entrar</button></form></section><section class="panel"><h2>Crear cuenta</h2><p>Usa el mismo correo que el propietario registró para ti. Confirma el correo para que el propietario pueda vincular tu cuenta.</p><form id="signup"><label>Correo<input name="email" type="email" required></label><label>Contraseña<input name="password" type="password" minlength="8" required></label><button class="secondary">Registrarme</button></form></section></div>`}
async function load(){const {data:{session}}=await db.auth.getSession();if(!session){auth();return}const {data:m,error}=await db.from('gz_managers').select('*').eq('auth_user_id',session.user.id).eq('active',true).maybeSingle();if(error)throw error;if(!m){app.innerHTML=header('Cuenta pendiente')+`<div id="notice" class="notice" hidden></div><section class="panel"><h1>Tu cuenta todavía no está vinculada</h1><p>Confirma el correo y avisa al propietario de la tienda para que vincule tu cuenta con el correo ${esc(session.user.email)}.</p><button class="secondary" id="signout">Salir</button></section>`;return}manager=m;const {data:s,error:se}=await db.from('gz_stores').select('*').eq('id',m.store_id).maybeSingle();if(se)throw se;if(!s)throw new Error('No se encontró la tienda.');store=s;const {data:p,error:pe}=await db.rpc('gz_public_catalog',{p_slug:s.slug,p_manager_slug:m.slug});if(pe)throw pe;catalog=p;products=catalog.products||[];const {data:o,error:oe}=await db.from('gz_orders').select('order_code,manager_commission,status,created_at,customer_total,currency').eq('manager_id',m.id).order('created_at',{ascending:false}).limit(100);if(oe)throw oe;orders=o||[];render()}
function render(){const link=new URL(`store.html?store=${encodeURIComponent(store.slug)}&ref=${encodeURIComponent(manager.slug)}`,location.href).href;app.innerHTML=header(store.name)+`<div id="notice" class="notice" hidden></div><section class="panel"><h1>Hola, ${esc(manager.name)}</h1><p>Tu margen por producto es la diferencia entre el precio que fijes y el precio base del negocio. No puedes vender por debajo del precio base.</p><p><strong>Tu enlace personal</strong></p><p class="copybox">${esc(link)}</p><button class="secondary" id="copy">Copiar enlace</button> <button class="smallbtn" id="signout">Salir</button></section><section class="panel"><h2>Tus pedidos (${orders.length})</h2><p class="muted">Comisión calculada por pedido. La app no liquida pagos automáticamente; el negocio debe confirmar la venta según sus acuerdos.</p>${orders.map(o=>`<div class="row"><div class="rowmain"><strong>${esc(o.order_code)}</strong><div class="muted">${new Date(o.created_at).toLocaleDateString('es')} · ${esc(o.status)}</div></div><div class="rowend"><strong>${money(o.manager_commission,store.currency)}</strong><div class="muted">comisión registrada</div></div></div>`).join('')||'<p class="muted">Todavía no hay pedidos atribuidos a tu enlace.</p>'}</section><section class="panel"><h2>Precios de venta</h2><p class="muted">Cambia los precios según tu estrategia. Solo se aplican a tus pedidos y a tu enlace; no modifican los precios de otros gestores.</p><div class="grid">${products.map(p=>`<article class="card"><h3>${esc(p.name)}</h3><p class="muted">Base del negocio: ${money(p.base_price,store.currency)} · Mínimo permitido: ${money(Math.max(Number(p.manager_floor||0),Number(p.base_price||0)),store.currency)} · Existencia: ${p.stock}</p><label>Tu precio (${esc(store.currency)})<input data-price="${p.id}" type="number" inputmode="decimal" min="${Math.max(Number(p.manager_floor||0),Number(p.base_price||0))}" step="0.01" value="${Number(p.price)}" aria-describedby="margin-${p.id}"></label><div class="muted" id="margin-${p.id}">Tu parte estimada: ${money(Number(p.price)-Number(p.base_price),store.currency)} por unidad</div><button class="primary" data-save="${p.id}">Guardar precio</button></article>`).join('')||'<p>No hay productos publicados en este momento.</p>'}</div></section>`;}
app.addEventListener('input',e=>{if(e.target.dataset.price){const p=products.find(x=>x.id===e.target.dataset.price);const n=Number(e.target.value||0);const el=$('#margin-'+p.id);if(el)el.textContent='Tu parte estimada: '+money(Math.max(0,n-Number(p.base_price)),store.currency)+' por unidad';}});
app.addEventListener('submit',async e=>{e.preventDefault();try{const f=new FormData(e.target);if(e.target.id==='login'){const {error}=await db.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)throw error;await load()}else if(e.target.id==='signup'){const {data,error}=await db.auth.signUp({email:f.get('email'),password:f.get('password')});if(error)throw error;msg(data.session?'Cuenta creada.':'Revisa tu correo y confirma la cuenta; luego avisa al propietario para vincularla.','success')}}catch(x){msg(errorText(x),'error')}});
app.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;try{if(b.id==='signout')await signOut();if(b.id==='copy'){await navigator.clipboard.writeText(new URL(`store.html?store=${store.slug}&ref=${manager.slug}`,location.href).href);msg('Enlace copiado.','success')}if(b.dataset.save){const p=products.find(x=>x.id===b.dataset.save);const price=Number($(`[data-price="${p.id}"]`).value);if(!Number.isFinite(price)||price<Math.max(Number(p.manager_floor||0),Number(p.base_price||0)))throw new Error('El precio no puede ser inferior al mínimo autorizado: '+money(Math.max(Number(p.manager_floor||0),Number(p.base_price||0)),store.currency));b.disabled=true;const {error}=await db.from('gz_manager_prices').upsert({manager_id:manager.id,product_id:p.id,price,updated_at:new Date().toISOString()},{onConflict:'manager_id,product_id'});if(error)throw error;msg('Precio guardado y aplicado a tus próximos pedidos.','success');b.disabled=false;}}catch(x){msg(errorText(x),'error');if(b.dataset.save)b.disabled=false}});
db.auth.onAuthStateChange(()=>setTimeout(()=>load().catch(e=>msg(errorText(e),'error')),0));try{await load()}catch(e){app.innerHTML=header('Panel de gestor')+'<div id="notice" class="notice error"></div>';msg(errorText(e),'error')}
})();
</script></body></html>
